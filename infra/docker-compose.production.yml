services:

  db:
    container_name: foodgram-db
    image: postgres:13.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodgram}
      POSTGRES_USER: ${POSTGRES_USER:-foodgram_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodgram_password}
    volumes:
      - pg_data:/var/lib/postgresql/data/

  backend:
    container_name: foodgram-backend
    image: ${DOCKER_USERNAME}/foodgram_backend:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodgram}
      POSTGRES_USER: ${POSTGRES_USER:-foodgram_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodgram_password}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-foodgram-production-secret-key}
      DEBUG: 'False'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-cyghost.ddns.net,158.160.214.187,localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://cyghost.ddns.net,http://cyghost.ddns.net,http://158.160.214.187}
    depends_on:
      - db
    volumes:
      - static:/app/collected_static/
      - media:/app/media/
      - ../data:/app/data:ro

  frontend:
    container_name: foodgram-front
    image: ${DOCKER_USERNAME}/foodgram_frontend:latest
    volumes:
      - frontend_build:/app/result_build/

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static:/var/html/static/
      - media:/var/html/media/

volumes:
  pg_data:
  static:
  media:
  frontend_build:
